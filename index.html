<style>
  :root {
    --bg: #F5EFE6;
    --bg-card: #FBF7F0;
    --text: #2E2A26;
    --text-muted: #7A7068;
    --gold: #B08D57;
    --gold-soft: #C9A961;
    --purple: #4A2E6B;
    --purple-light: #6B4A8E;
    --purple-border: rgba(74, 46, 107, 0.18);
    --purple-border-hover: rgba(74, 46, 107, 0.38);
    --purple-bg-selected: rgba(74, 46, 107, 0.08);
    --border: rgba(46, 42, 38, 0.08);
    --shadow-sm: 0 1px 4px rgba(46, 42, 38, 0.06);
    --shadow-md: 0 2px 12px rgba(46, 42, 38, 0.08);

  * { box-sizing: border-box; margin: 0; padding: 0; }

    color: var(--text);
    font-family: 'Lora', Georgia, serif;
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px 80px;
    position: relative;
  }
  .progress {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(46, 42, 38, 0.06);
    z-index: 10;
  }
  .progress__fill {
    height: 100%;
    background: var(--gold);
    width: 0%;
    transition: width 0.4s ease;
  }
  .screen { display: none; animation: fadeIn 0.4s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .ornament {
    display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-bottom: 40px; color: var(--gold);
  }
  .ornament::before, .ornament::after {
    content: ''; height: 1px; width: 60px;
    background: var(--gold); opacity: 0.5;
  }
  .ornament__diamond {
    width: 6px; height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }
  .welcome { text-align: center; padding-top: 60px; }
  .welcome__title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 56px; font-weight: 500;
    line-height: 1.1; letter-spacing: -0.5px;
    margin-bottom: 24px;
  }
  .welcome__subtitle {
    font-size: 17px; color: var(--text-muted);
    max-width: 380px; margin: 0 auto 48px;
    line-height: 1.7;
  }
  .welcome__note {
    margin-top: 24px; font-size: 14px;
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
  }
  .btn {
    display: inline-block;
    padding: 14px 36px;
    font-family: 'Inter', sans-serif;
    font-size: 15px; font-weight: 500;
    letter-spacing: 0.3px;
    color: #F5EFE6;
    background: var(--purple);
    border: none; border-radius: 999px;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 2px 8px rgba(74, 46, 107, 0.2);
  }
  .btn:hover {
    background: var(--purple-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(74, 46, 107, 0.28);
  }
  .btn:disabled {
    opacity: 0.4; cursor: default;
    transform: none; box-shadow: 0 2px 8px rgba(74, 46, 107, 0.1);
  }
  .btn--ghost {
    background: transparent;
    color: var(--purple);
    border: 1px solid rgba(74, 46, 107, 0.25);
    box-shadow: none;
  }
  .btn--ghost:hover {
    background: rgba(74, 46, 107, 0.06);
    box-shadow: none;
  }
  .q-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 40px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    color: var(--text-muted); text-transform: uppercase;
  }
  .q-text {
    font-family: 'Lora', serif;
    font-size: 24px; line-height: 1.5;
    margin-bottom: 40px; font-weight: 400;
  }
  .scale { margin: 48px 0 24px; }
  .scale__dots {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; padding: 0 8px;
  }
  .scale__dots::before {
    content: ''; position: absolute;
    top: 50%; left: 8px; right: 8px;
    height: 1px; background: rgba(46, 42, 38, 0.1);
    transform: translateY(-50%);
  }
  .scale__dot {
    position: relative;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--bg);
    border: 1.5px solid rgba(46, 42, 38, 0.25);
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 1;
  }
  .scale__dot:hover { border-color: var(--gold); transform: scale(1.15); }
  .scale__dot.selected {
    background: var(--gold); border-color: var(--gold);
    box-shadow: 0 0 0 4px rgba(176, 141, 87, 0.15);

  .scale__labels {
    display: flex; justify-content: space-between;
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px; color: var(--text-muted);
  }
  .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .option {
    padding: 20px 24px;
    background: var(--bg-card);
    border: 1px solid var(--purple-border);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    font-size: 17px; line-height: 1.5;
    display: flex; gap: 14px; align-items: flex-start;
    text-align: left;
    font-family: 'Lora', serif;
    color: var(--text);
    position: relative;
  }
  .option:hover {
    border-color: var(--purple-border-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-md);
  }
  .option.selected {
    border-color: var(--gold);
    background: var(--purple-bg-selected);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .option.selected:hover {
    transform: translateY(-1px);
  }
  .option__letter {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px; font-weight: 600;
    color: var(--gold); flex-shrink: 0; width: 22px;
  }
  .option__text { flex: 1; }
  .option__check {
    font-size: 16px; color: var(--gold);
    flex-shrink: 0; width: 20px; text-align: center;
    opacity: 0; transition: opacity 0.2s ease;
    font-family: 'Inter', sans-serif;
  }
  .option.selected .option__check { opacity: 1; }
  .multi-hint {
    font-family: 'Inter', sans-serif;
    font-size: 13px; color: var(--text-muted);
    text-align: center; margin-bottom: 24px;
  }
  .ranking { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .rank-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    background: var(--bg-card);
    border: 1px solid var(--purple-border);
    border-radius: 12px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    will-change: transform;
  }
  .rank-item:hover { border-color: var(--purple-border-hover); }
  .rank-item.dragging {
    cursor: grabbing;
    z-index: 10;
    border-color: var(--gold);
    background: var(--purple-bg-selected);
    box-shadow: 0 6px 20px rgba(46, 42, 38, 0.14);

    font-family: 'Cormorant Garamond', serif;
    font-size: 24px; font-weight: 600;
    color: var(--gold); width: 28px; text-align: center;

  .rank-item__btn {

    cursor: pointer; color: var(--text-muted);
    font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    transition: all 0.15s ease;

    color: var(--purple);
    background: rgba(74, 46, 107, 0.08);

    font-size: 13px; color: var(--text-muted);
    text-align: center; margin-bottom: 32px;

    align-items: center; justify-content: space-between;
    margin-top: 32px;

  .actions--center { justify-content: center; }
  .back {
    font-family: 'Inter', sans-serif;
    font-size: 14px; color: var(--text-muted);
    background: transparent; border: none;
    cursor: pointer; padding: 8px 0;
    transition: color 0.2s ease;
  }
  .back:hover { color: var(--purple); }
  .result { text-align: center; padding-top: 20px; }
  .result__label {
    font-family: 'Inter', sans-serif;
    font-size: 13px; letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted); margin-bottom: 12px;
  }
  .result__name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px; font-weight: 500;
    color: var(--purple);
    line-height: 1.1; margin-bottom: 32px;
    letter-spacing: -0.5px;
  }
  .result__quote {
    font-family: 'Lora', serif;
    font-style: italic; font-size: 20px; line-height: 1.6;
    color: var(--text);
    max-width: 440px; margin: 0 auto 32px;
  }
  .result__quote::before, .result__quote::after {
    content: ''; display: block;
    width: 30px; height: 1px;
    background: var(--gold);
    margin: 24px auto; opacity: 0.6;
  }
  .result__desc {
    font-size: 17px; line-height: 1.7;
    text-align: left; max-width: 500px;
    margin: 0 auto 32px;
  }
  .result__why {
    background: var(--bg-card);
    border: 1px solid var(--purple-border);
    border-radius: 12px;
    padding: 20px 24px;
    text-align: left; max-width: 500px;
    margin: 0 auto 32px;
    cursor: pointer;
  }
  .result__why summary {
    font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 500;
    letter-spacing: 0.5px; color: var(--purple);
    list-style: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  .result__why summary::-webkit-details-marker { display: none; }
  .result__why summary::after {
    content: '+'; font-size: 18px; color: var(--gold);
    transition: transform 0.2s ease;
  }
  .result__why[open] summary::after { transform: rotate(45deg); }
  .result__why p {
    margin-top: 16px; font-size: 16px;
    line-height: 1.7; color: var(--text-muted);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1A1620;
      --bg-card: #231E2A;
      --text: #E8E0D5;
      --text-muted: #9A9088;

    .btn--ghost {

      border-color: rgba(184, 160, 217, 0.3);

    .btn--ghost:hover { background: rgba(184, 160, 217, 0.1); }
    .result__name { color: var(--gold); }

    .scale__dot {

    .progress { background: rgba(232, 224, 213, 0.06); }
    .rank-item.dragging { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); }
  }
  @media (max-width: 520px) {
    .app { padding: 32px 20px 60px; }
    .welcome__title { font-size: 42px; }
    .result__name { font-size: 48px; }
    .q-text { font-size: 21px; }
    .ornament::before, .ornament::after { width: 40px; }
  }
</style>
</head>

// ============================================================
// СОСТОЯНИЕ
// ============================================================

const state = {
  current: -1,
  answers: {},
  rankings: {},
  multiAnswers: {},
  questions: null,
};

RANKING_QUESTIONS.forEach(q => {
  state.rankings[q.id] = q.items.map((_, i) => i);
});

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuestions() {
  return [
    ...shuffle(SCALE_QUESTIONS),
    ...shuffle(SCENARIO_QUESTIONS),
    ...shuffle(RANKING_QUESTIONS),
    ...shuffle(MULTI_QUESTIONS),
    ...shuffle(CALIBRATION_QUESTIONS),
  ];
}

// ============================================================
// НАВИГАЦИЯ
// ============================================================

function go(index) {
  state.current = index;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  updateProgress();
}

function updateProgress() {
  const fill = document.getElementById('progressFill');
  if (!state.questions || state.current < 0) { fill.style.width = '0%'; return; }
  if (state.current >= state.questions.length) { fill.style.width = '100%'; return; }
  const pct = (state.current / state.questions.length) * 100;
  fill.style.width = pct + '%';
}

// ============================================================
// РЕНДЕР
// ============================================================

const app = document.getElementById('app');

function render() {
  if (state.current < 0) { renderWelcome(); return; }
  if (state.current >= state.questions.length) { renderResult(); return; }
  const q = state.questions[state.current];
  if (q.type === 'scale' || q.type === 'weight') renderScale(q);
  else if (q.type === 'scenario') renderScenario(q);
  else if (q.type === 'ranking') renderRanking(q);
  else if (q.type === 'multi') renderMulti(q);
}

function renderWelcome() {
  app.innerHTML = `
    <section class="screen active">
      <div class="welcome">
        <div class="ornament"><div class="ornament__diamond"></div></div>
        <h1 class="welcome__title">Какой ты<br>философ?</h1>
        <p class="welcome__subtitle">Тест из 25 вопросов. Он не оценивает — он узнаёт. Отвечайте честно, первое побуждение обычно самое точное.</p>
        <button class="btn" onclick="startQuiz()">Начать</button>
        <p class="welcome__note">~15 минут</p>
      </div>
    </section>
  `;
}

function startQuiz() {
  state.questions = buildQuestions();
  state.answers = {};
  state.multiAnswers = {};
  RANKING_QUESTIONS.forEach(q => {
    state.rankings[q.id] = q.items.map((_, i) => i);
  });
  go(0);
}

function renderScale(q) {
  const current = state.answers[q.id];
  const isWeight = q.type === 'weight';
  const labels = isWeight ? q.labels : ['совсем не согласен','полностью согласен'];
  const dots = [1,2,3,4,5].map(v =>
    `<div class="scale__dot ${current === v ? 'selected' : ''}" data-val="${v}"></div>`
  ).join('');
  app.innerHTML = `
    <section class="screen active">
      <div class="q-header">
        <span>Вопрос ${state.current + 1}</span>
        <span>${state.current + 1} / ${state.questions.length}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <div class="scale">
        <div class="scale__dots" id="scaleDots">${dots}</div>
        <div class="scale__labels">
          <span>${labels[0]}</span>
          <span>${labels[1]}</span>
        </div>
      </div>
      <div class="actions">
        <button class="back" onclick="go(${state.current - 1})">← Назад</button>
        <button class="btn" id="nextBtn" ${current ? '' : 'disabled'} onclick="go(${state.current + 1})">Далее</button>
      </div>
    </section>
  `;
  document.querySelectorAll('#scaleDots .scale__dot').forEach(dot => {
    dot.addEventListener('click', () => {
      state.answers[q.id] = parseInt(dot.dataset.val);
      document.querySelectorAll('#scaleDots .scale__dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    });
  });
}

function renderScenario(q) {
  const current = state.answers[q.id];
  const opts = q.options.map(o => `
    <button class="option ${current === o.letter ? 'selected' : ''}" data-letter="${o.letter}">
      <span class="option__letter">${o.letter}</span>
      <span class="option__text">${o.text}</span>
    </button>
  `).join('');
  app.innerHTML = `
    <section class="screen active">
      <div class="q-header">
        <span>Вопрос ${state.current + 1}</span>
        <span>${state.current + 1} / ${state.questions.length}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <div class="options" id="scenarioOptions">${opts}</div>
      <div class="actions">
        <button class="back" onclick="go(${state.current - 1})">← Назад</button>
        <button class="btn" id="nextBtn" ${current ? '' : 'disabled'} onclick="go(${state.current + 1})">Далее</button>
      </div>
    </section>
  `;
  document.querySelectorAll('#scenarioOptions .option').forEach(opt => {
    opt.addEventListener('click', () => {
      state.answers[q.id] = opt.dataset.letter;
      document.querySelectorAll('#scenarioOptions .option').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      document.getElementById('nextBtn').disabled = false;
    });
  });
}

function renderMulti(q) {
  const current = state.multiAnswers[q.id] || [];
  const opts = q.items.map((text, idx) => `
    <button class="option ${current.includes(idx) ? 'selected' : ''}" data-idx="${idx}">
      <span class="option__text">${text}</span>
      <span class="option__check">✓</span>
    </button>
  `).join('');
  app.innerHTML = `
    <section class="screen active">
      <div class="q-header">
        <span>Вопрос ${state.current + 1}</span>
        <span>${state.current + 1} / ${state.questions.length}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <p class="multi-hint" id="multiHint">Выбрано: ${current.length} / ${q.max}</p>
      <div class="options" id="multiOptions">${opts}</div>
      <div class="actions">
        <button class="back" onclick="go(${state.current - 1})">← Назад</button>
        <button class="btn" id="nextBtn" ${current.length > 0 ? '' : 'disabled'} onclick="go(${state.current + 1})">Далее</button>
      </div>
    </section>
  `;
  document.querySelectorAll('#multiOptions .option').forEach(opt => {
    opt.addEventListener('click', () => {
      const idx = parseInt(opt.dataset.idx);
      const arr = state.multiAnswers[q.id] || [];
      const pos = arr.indexOf(idx);
      if (pos >= 0) {
        arr.splice(pos, 1);
      } else {
        if (arr.length >= q.max) return;
        arr.push(idx);
      }
      state.multiAnswers[q.id] = arr;
      opt.classList.toggle('selected', arr.includes(idx));
      document.getElementById('multiHint').textContent = `Выбрано: ${arr.length} / ${q.max}`;
      document.getElementById('nextBtn').disabled = arr.length === 0;
    });
  });
}

function renderRanking(q) {
  const order = state.rankings[q.id];
  const items = order.map((itemIdx, pos) => `
    <div class="rank-item" data-item-idx="${itemIdx}" data-pos="${pos}">
      <span class="rank-item__num">${pos + 1}</span>
      <span class="rank-item__label">${q.items[itemIdx]}</span>
      <div class="rank-item__controls">
        <button class="rank-item__btn" data-dir="up" ${pos === 0 ? 'disabled' : ''}>▲</button>
        <button class="rank-item__btn" data-dir="down" ${pos === order.length - 1 ? 'disabled' : ''}>▼</button>
      </div>
    </div>
  `).join('');
  app.innerHTML = `
    <section class="screen active">
      <div class="q-header">
        <span>Вопрос ${state.current + 1}</span>
        <span>${state.current + 1} / ${state.questions.length}</span>
      </div>
      <p class="q-text">${q.text}</p>
      <div class="ranking" id="rankingList">${items}</div>
      <p class="rank-hint">Перетащите карточки или используйте стрелки. 1 — самое важное, ${order.length} — наименее важное.</p>
      <div class="actions">
        <button class="back" onclick="go(${state.current - 1})">← Назад</button>
        <button class="btn" onclick="go(${state.current + 1})">Далее</button>
      </div>
    </section>
  `;
  setupRankingInteractions(q);
}

function setupRankingInteractions(q) {
  const container = document.getElementById('rankingList');
  const items = Array.from(container.querySelectorAll('.rank-item'));

  items.forEach(item => {
    item.querySelectorAll('.rank-item__btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const pos = parseInt(item.dataset.pos);
        const dir = btn.dataset.dir;
        const arr = state.rankings[q.id];
        if (dir === 'up' && pos > 0) {
          [arr[pos - 1], arr[pos]] = [arr[pos], arr[pos - 1]];
        } else if (dir === 'down' && pos < arr.length - 1) {
          [arr[pos + 1], arr[pos]] = [arr[pos], arr[pos + 1]];
        }
        refreshRankingDom(q);
      });
    });
  });

  const gap = 10;
  let from = -1;
  let to = -1;
  let startY = 0;
  let itemH = 0;

  items.forEach((item, idx) => {
    item.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.rank-item__btn')) return;
      if (e.button !== undefined && e.button !== 0) return;
      from = idx;
      to = idx;
      startY = e.clientY;
      itemH = item.offsetHeight + gap;
      item.classList.add('dragging');
      item.style.transition = 'none';
      try { item.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });

    item.addEventListener('pointermove', (e) => {
      if (from !== idx) return;
      const dy = e.clientY - startY;
      item.style.transform = `translateY(${dy}px)`;
      const newTo = Math.max(0, Math.min(items.length - 1, idx + Math.round(dy / itemH)));
      if (newTo !== to) {
        to = newTo;
        items.forEach((other, i) => {
          if (i === idx) return;
          let shift = 0;
          if (idx < to && i > idx && i <= to) shift = -itemH;
          else if (idx > to && i < idx && i >= to) shift = itemH;
          other.style.transition = 'transform 0.18s ease';
          other.style.transform = shift ? `translateY(${shift}px)` : '';
        });
      }
    });

    const finish = (e) => {
      if (from !== idx) return;
      items.forEach(el => {
        el.style.transition = 'none';
        el.style.transform = '';
        el.classList.remove('dragging');
      });

      if (from !== to) {
        const arr = state.rankings[q.id];
        const [moved] = arr.splice(from, 1);
        arr.splice(to, 0, moved);
      }

      const byIdx = {};
      items.forEach(el => { byIdx[parseInt(el.dataset.itemIdx)] = el; });
      state.rankings[q.id].forEach(itemIdx => {
        container.appendChild(byIdx[itemIdx]);
      });
      const newItems = Array.from(container.querySelectorAll('.rank-item'));
      newItems.forEach((el, newPos) => {
        el.dataset.pos = newPos;
        el.querySelector('.rank-item__num').textContent = newPos + 1;
        el.querySelector('[data-dir="up"]').disabled = newPos === 0;
        el.querySelector('[data-dir="down"]').disabled = newPos === newItems.length - 1;
      });

      requestAnimationFrame(() => {
        newItems.forEach(el => { el.style.transition = ''; });
      });

      from = -1;
      to = -1;
    };

    item.addEventListener('pointerup', finish);
    item.addEventListener('pointercancel', finish);
  });
}

function refreshRankingDom(q) {
  const container = document.getElementById('rankingList');
  const byIdx = {};
  Array.from(container.querySelectorAll('.rank-item')).forEach(el => {
    byIdx[parseInt(el.dataset.itemIdx)] = el;
  });
  state.rankings[q.id].forEach(itemIdx => {
    container.appendChild(byIdx[itemIdx]);
  });
  const newItems = Array.from(container.querySelectorAll('.rank-item'));
  newItems.forEach((el, newPos) => {
    el.dataset.pos = newPos;
    el.querySelector('.rank-item__num').textContent = newPos + 1;
    el.querySelector('[data-dir="up"]').disabled = newPos === 0;
    el.querySelector('[data-dir="down"]').disabled = newPos === newItems.length - 1;
  });
}

// ============================================================
// ПОДСЧЁТ
// ============================================================

function computeScores() {
  const scores = {};
  PHILOSOPHERS.forEach(p => scores[p.name] = 0);

  let userVec = [0,0,0,0,0,0,0,0,0];
  SCALE_QUESTIONS.forEach(q => {
    const ans = state.answers[q.id];
    if (ans === undefined) return;
    const shift = (ans - 3) / 2;
    q.dir.forEach((d, i) => { userVec[i] += d * shift; });
  });

  PHILOSOPHERS.forEach(p => {
    let dist = 0;
    for (let i = 0; i < 9; i++) {
      const diff = userVec[i] - p.v[i];
      dist += diff * diff;
    }
    scores[p.name] += -Math.sqrt(dist);
  });

  const allScenarios = SCENARIO_QUESTIONS.concat(CALIBRATION_QUESTIONS.filter(q => q.type === 'scenario'));
  allScenarios.forEach(q => {
    const ans = state.answers[q.id];
    if (!ans) return;
    const opt = q.options.find(o => o.letter === ans);
    if (!opt) return;
    Object.entries(opt.points).forEach(([name, pts]) => {
      if (scores[name] !== undefined) scores[name] += pts;
    });
  });

  MULTI_QUESTIONS.forEach(q => {
    const selected = state.multiAnswers[q.id] || [];
    if (selected.length === 0) return;
    const map = TOP3_MAPS[q.id] || {};
    PHILOSOPHERS.forEach(p => {
      const top3 = map[p.name] || [];
      selected.forEach(idx => {
        if (top3.includes(idx)) scores[p.name] += 1;
      });
    });
  });

  RANKING_QUESTIONS.forEach(q => {
    const userOrder = state.rankings[q.id];
    if (!userOrder) return;
    const userPos = {};
    userOrder.forEach((itemIdx, pos) => { userPos[itemIdx] = pos; });
    PHILOSOPHERS.forEach(p => {
      const philOrder = p.r[q.id];
      if (!philOrder) return;
      const philPos = {};
      philOrder.forEach((itemIdx, pos) => { philPos[itemIdx] = pos; });
      let sumD2 = 0;
      for (let i = 0; i < q.items.length; i++) {
        const d = (userPos[i] ?? 0) - (philPos[i] ?? 0);
        sumD2 += d * d;
      }
      const n = q.items.length;
      const rho = 1 - (6 * sumD2) / (n * (n * n - 1));
      scores[p.name] += rho * 3;
    });
  });

  const wAns = state.answers[23];
  let W = 1.0;
  if (wAns === 3) W = 0.9;
  else if (wAns === 4 || wAns === 5) W = 0.75;
  Object.keys(scores).forEach(k => { scores[k] *= W; });

  return scores;
}

function topResult() {
  const scores = computeScores();
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  return sorted[0][0];
}

// ============================================================
// РЕЗУЛЬТАТ
// ============================================================

function renderResult() {
  const name = topResult();
  const d = RESULTS[name];
  const traitsText = d.traits.slice(0, 3).join(', ');
  const why = `Ваши ответы показали: ${traitsText}. Это ближе всего к ${name} — ${d.essence}.`;
  app.innerHTML = `
    <section class="screen active">
      <div class="result">
        <div class="ornament"><div class="ornament__diamond"></div></div>
        <p class="result__label">Вы —</p>
        <h2 class="result__name">${name}</h2>
        <p class="result__quote">${d.quote}</p>
        <p class="result__desc">${d.desc}</p>
        <details class="result__why">
          <summary>Почему вы</summary>
          <p>${why}</p>
        </details>
        <div class="actions actions--center">
          <button class="btn btn--ghost" onclick="restart()">Пройти ещё раз</button>
        </div>
      </div>
    </section>
  `;
}

function restart() {
  state.current = -1;
  state.answers = {};
  state.multiAnswers = {};
  state.questions = null;
  RANKING_QUESTIONS.forEach(q => {
    state.rankings[q.id] = q.items.map((_, i) => i);
  });
  render();
  updateProgress();
}

// ============================================================
// СТАРТ
// ============================================================

render();
</script>
